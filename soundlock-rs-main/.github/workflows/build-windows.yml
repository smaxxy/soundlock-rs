name: winEXE
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 缓存 Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 编译正式版EXE
        run: cargo build --release

      - name: 压缩exe
        run: Compress-Archive target/release/sound_lock_rust.exe 修复版软件.zip

      - name: 保存打包文件
        uses: actions/upload-artifact@v4
        with:
          name: 软件压缩包
          path: 修复版软件.zip
