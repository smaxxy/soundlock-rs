name: Build and Release
on:
  release:
    types: [published, edited]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: i686-pc-windows-msvc
          components: rustfmt, clippy
      - name: Build for Windows x86
        run: cargo build --release --target i686-pc-windows-msvc
      - name: Package executable
        run: |
          mkdir -p release
          cp target/i686-pc-windows-msvc/release/sound_lock_rust.exe release/
          cd release
          zip -q ../sound_lock_rust-x86-windows-${{ github.event.release.tag_name }}.zip sound_lock_rust.exe
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./sound_lock_rust-x86-windows-${{ github.event.release.tag_name }}.zip
          asset_name: sound_lock_rust-x86-windows-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
